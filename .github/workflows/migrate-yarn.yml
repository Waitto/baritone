name: Migrate Baritone to Yarn

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Prepare single Yarn source set
        shell: bash
        run: |
          mkdir -p src/main/java
          for root in api launch schematica_api; do
            if [ -d "src/$root/java" ]; then
              cp -R "src/$root/java/." src/main/java/
            fi
          done
          rm -rf src/api src/launch src/schematica_api

      - name: Migrate Mojmap sources to Yarn
        shell: bash
        run: |
          set -o pipefail
          if grep -q 'import net.minecraft.client.MinecraftClient;' src/main/java/baritone/Baritone.java; then
            echo "Sources already use Yarn mappings; skipping migration" | tee migration.log
          else
            gradle migrateMappings --mappings "1.21.4+build.8" --overrideInputsIHaveABackup --stacktrace --info 2>&1 | tee migration.log
          fi

      - name: Upload migration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-log
          path: migration.log
          if-no-files-found: warn

      - name: Repair Yarn source edge cases
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("src/main/java")
          replacements = {
              "import java.awt.*;": "import java.awt.Color;",
              "import net.minecraft.world.item.enchantment.*;": "",
              "import net.minecraft.world.level.block.*;": "import net.minecraft.block.*;",
              "import net.minecraft.network.chat.*;": "import net.minecraft.text.*;",
              "import net.minecraft.network.protocol.game.*;": "import net.minecraft.network.packet.s2c.play.*;",
              "import com.mojang.blaze3d.vertex.*;": "import net.minecraft.client.render.*;",
          }

          special_awt = {
              "src/main/java/baritone/api/utils/NotificationHelper.java": "import java.awt.*;",
          }

          for path in root.rglob("*.java"):
              text = path.read_text(encoding="utf-8")
              old = text
              for src, dst in replacements.items():
                  text = text.replace(src, dst)

              if path.as_posix() in special_awt:
                  text = text.replace("import java.awt.Color;", special_awt[path.as_posix()])
              text = text.replace(
                  "public abstract class Data<T> implements IData<T> {",
                  "public abstract class MixinPalettedContainer$Data<T> implements IData<T> {"
              )
              if text != old:
                  path.write_text(text, encoding="utf-8")
          PY

      - name: Switch build to Yarn
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build.gradle")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              'mappings loom.officialMojangMappings()',
              'mappings "net.fabricmc:yarn:1.21.4+build.8:v2"'
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Verify migration output
        shell: bash
        run: |
          test -f src/main/java/baritone/Baritone.java
          test -f src/main/java/baritone/behavior/LookBehavior.java
          echo "Yarn migration completed"

      - name: Compile Yarn sources
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee compile.log

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: compile.log
          if-no-files-found: warn


      - name: Verify runnable Fabric jar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          required = {
              "fabric.mod.json",
              "mixins.baritone-meteor.json",
              "mixins.baritone-meteor-refmap.json",
              "baritone/Baritone.class",
              "META-INF/jars/nether-pathfinder-1.4.1.jar",
          }

          for jar in Path("build/libs").glob("*.jar"):
              try:
                  with ZipFile(jar) as archive:
                      missing = required - set(archive.namelist())
                      if not missing:
                          print(f"Verified runnable jar: {jar}")
                          break
              except Exception:
                  continue
          else:
              raise SystemExit("No built jar contains Baritone classes, Fabric metadata, Mixin config/refmap, and nested dependency")
          PY

      - name: Archive migrated sources
        if: always()
        shell: bash
        run: |
          tar -czf migrated-sources.tar.gz src

      - name: Upload migrated sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrated-sources
          path: migrated-sources.tar.gz
          if-no-files-found: error

      - name: Commit migrated sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src build.gradle settings.gradle gradle.properties

          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi

          git commit -m "migrate Baritone 1.21.4 sources to Yarn"
          git push origin main
