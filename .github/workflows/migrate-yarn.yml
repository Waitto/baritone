name: Migrate Baritone to Yarn

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Migrate Mojmap sources to Yarn
        shell: bash
        run: |
          set -o pipefail
          gradle migrateMappings --mappings "1.21.4+build.8" --overrideInputsIHaveABackup --stacktrace --info 2>&1 | tee migration.log

      - name: Upload migration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-log
          path: migration.log
          if-no-files-found: warn

      - name: Switch build to Yarn
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build.gradle")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              'mappings loom.officialMojangMappings()',
              'mappings "net.fabricmc:yarn:1.21.4+build.8:v2"'
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Verify Yarn names
        shell: bash
        run: |
          test -f src/main/java/baritone/Baritone.java
          test -f src/main/java/baritone/behavior/LookBehavior.java

          if grep -R -E 'net\.minecraft\.client\.Minecraft(;|\.)' src --include="*.java" >/dev/null; then
            echo "Found Mojmap Minecraft references after migration"
            exit 1
          fi

          if grep -R -E 'net\.minecraft\.util\.Mth(;|\.)' src --include="*.java" >/dev/null; then
            echo "Found Mojmap Mth references after migration"
            exit 1
          fi

          if grep -R 'net\.minecraft\.network\.protocol' src --include="*.java" >/dev/null; then
            echo "Found Mojmap network references after migration"
            exit 1
          fi

          if grep -R -E 'net\.minecraft\.class_[0-9]+' src --include="*.java" >/dev/null; then
            echo "Found Intermediary class references after migration"
            exit 1
          fi


      - name: Compile Yarn sources
        run: gradle compileJava --no-daemon

      - name: Commit migrated sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src build.gradle settings.gradle gradle.properties

          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi

          git commit -m "migrate Baritone 1.21.4 sources to Yarn"
          git push origin main
